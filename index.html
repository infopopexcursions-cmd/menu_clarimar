<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Menú digital de Larimar Chill Zone"
  >

  <title>
    Larimar Chill Zone | Menú
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="page-shell">


    <!-- ==================================================
         HERO
    ================================================== -->

    <header class="hero">

      <div
        class="hero-bubbles"
        aria-hidden="true"
      ></div>

      <div class="logo-mark">

        <img
          src="images/logo.png"
          alt="Larimar Chill Zone"
          class="site-logo"
        >

      </div>

      <p class="eyebrow">
        MENÚ DIGITAL
      </p>

      <h1>
        Sabores del Caribe
      </h1>

      <p class="hero-text">
        Comida, cócteles y bebidas para disfrutar frente al mar.
      </p>

      <div class="currency-note">

        <span>★</span>

        Precios expresados en dólares estadounidenses (USD)

      </div>

    </header>


    <!-- ==================================================
         NAVEGACIÓN
    ================================================== -->

    <nav
      class="category-nav"
      aria-label="Categorías del menú"
    >

      <button
        class="filter-btn active"
        data-category="all"
      >
        Todo
      </button>

      <button
        class="filter-btn"
        data-category="food"
      >
        Comida
      </button>

      <button
        class="filter-btn"
        data-category="specials"
      >
        Especialidades
      </button>

      <button
        class="filter-btn"
        data-category="smoothies"
      >
        Smoothies
      </button>

      <button
        class="filter-btn"
        data-category="cocktails"
      >
        Cócteles
      </button>

      <button
        class="filter-btn"
        data-category="shots"
      >
        Shots
      </button>

    </nav>


    <!-- ==================================================
         BUSCADOR
    ================================================== -->

    <div class="search-box">

      <input
        type="search"
        id="menuSearch"
        placeholder="Buscar en el menú..."
        aria-label="Buscar en el menú"
      >

    </div>


    <!-- ==================================================
         MENÚ
    ================================================== -->

    <main
      id="menu"
      class="menu-container"
    ></main>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

      <div class="footer-wave"></div>

      <div class="footer-content">

        <strong>
          CLARIMAR
          <span>Chill Zone</span>
        </strong>

        <p>
          Gracias por visitarnos. ¡Que disfrutes tu experiencia!
        </p>

        <small>
          Menú digital · Precios sujetos a cambios
        </small>

      </div>

    </footer>

  </div>


  <!-- ====================================================
       BOTÓN VOLVER ARRIBA
  ==================================================== -->

  <button
    class="back-top"
    id="backTop"
    aria-label="Volver arriba"
  >
    ↑
  </button>


  <!-- ====================================================
       MODAL SOLO IMAGEN
  ==================================================== -->

  <div
    class="modal"
    id="itemModal"
    aria-hidden="true"
  >

    <div
      class="modal-overlay"
      data-close-modal
    ></div>


    <div
      class="modal-card image-only-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Vista de imagen"
    >

      <button
        class="modal-close"
        data-close-modal
        aria-label="Cerrar"
      >
        ×
      </button>


      <div class="modal-image">

        <img
          id="modalImage"
          src=""
          alt=""
        >


        <div
          id="modalImageFallback"
          class="modal-image-fallback"
          style="display:none;"
        >
          🍹
        </div>

      </div>

    </div>

  </div>


  <!-- ====================================================
       JAVASCRIPT
  ==================================================== -->

  <script src="script.js"></script>

</body>

</html>
